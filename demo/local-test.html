<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecoflow Bubble — prueba local de voz</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 20%, #10312b, transparent 30rem), #0b1f1f;
        color: #fff;
      }
      main { max-width: 32rem; margin: 0 auto; padding: 2rem; }
      li { margin: .4rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prueba local: animación del input</h1>
      <ul>
        <li>Al enviar un mensaje, el borde del input se ilumina con un gradiente deslizándose mientras llega la respuesta.</li>
      </ul>
    </main>

    <script>
      window.ECOFLOW_CONFIG = {
        chatflowId: "9e92eac6-5cc3-4630-95da-5798820d919c",
        apiHost: "https://ecoflow.koppi.mx",
        buttonBackgroundColor: "#000000",
        windowTitle: "Nizuc Concierge",
        windowWelcomeMessage: "Hello! How can I assist you today?",
        textInputPlaceholder: "Ask me anything...",
        glass: true,
        persistConversation: false
      };
    </script>
    <script src="../dist/ecoflow-bubble.js" defer></script>
  </body>
</html>
